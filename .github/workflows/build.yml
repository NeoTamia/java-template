name: Build Action

on:
  push:
    branches:
      - main
      - dev
    tags: [ 'v*' ]
    paths:
      - '**.java'
      - '.github/workflows/build.yml'
      - 'gradle/**'
      - '**.gradle'
      - '**.kts'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '**.java'
      - '.github/workflows/build.yml'
      - 'gradle/**'
      - '**.gradle'
      - '**.kts'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a new release (default: to snapshots)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v')}}

jobs:
  build-and-publish:
    name: Build and Publish
    uses: NeoTamia/actions/.github/workflows/jvm-build-and-publish.yml@19c096d7414b3b1756eea45e5aa5c7a3eaed3455 # main
    with:
      release: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true' }}
    secrets: inherit
